[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mattermatch"
version = "0.1.0"
description = "Match Matter commissioning QR codes to an inventory CSV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MatterMatch contributors"}]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "zxing-cpp>=2.2",
]

[project.scripts]
mattermatch = "mattermatch.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: tests requiring optional native decoder dependencies"]
